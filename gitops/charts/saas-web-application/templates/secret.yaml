apiVersion: v1
kind: Secret
metadata:
  name: {{ include "saas-web-application.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "saas-web-application.labels" . | nindent 4 }}
type: Opaque
stringData:
  # NOTE: values in .Values.secrets are PLACEHOLDERS. Override them in
  # production using a SealedSecret (bitnami) or ExternalSecret (aws secrets
  # manager) instead of committing real values to the GitOps repo.
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
