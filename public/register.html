<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create account — Acme SaaS</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="container">
      <nav class="nav">
        <a class="brand" href="/">Acme<span>SaaS</span></a>
        <div class="nav-links">
          <a href="/#features">Features</a>
          <a href="/#pricing">Pricing</a>
          <a class="btn" href="/login">Log in</a>
        </div>
      </nav>

      <div class="form-wrap">
        <h1>Create your account</h1>
        <p class="sub">Start on the free plan. No credit card required.</p>
        <div class="error" id="error"></div>
        <form id="register-form">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required autocomplete="name" />
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" />
          <label for="password">Password <span class="muted small">(8+ characters)</span></label>
          <input
            type="password"
            id="password"
            name="password"
            required
            minlength="8"
            autocomplete="new-password"
          />
          <button class="btn primary" type="submit" style="width: 100%; margin-top: 20px">
            Create account
          </button>
        </form>
        <p class="small muted" style="margin-top: 16px">
          Already have an account? <a href="/login">Log in</a>.
        </p>
      </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
      const form = document.getElementById("register-form");
      const errorBox = document.getElementById("error");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorBox.style.display = "none";
        try {
          await submitAuth("/api/auth/register", {
            name: form.name.value.trim(),
            email: form.email.value.trim(),
            password: form.password.value,
          });
        } catch (err) {
          errorBox.textContent = err.message;
          errorBox.style.display = "block";
        }
      });
    </script>
  </body>
</html>
