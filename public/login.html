<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in — Acme SaaS</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="container">
      <nav class="nav">
        <a class="brand" href="/">Acme<span>SaaS</span></a>
        <div class="nav-links">
          <a href="/#features">Features</a>
          <a href="/#pricing">Pricing</a>
          <a class="btn" href="/register">Sign up</a>
        </div>
      </nav>

      <div class="form-wrap">
        <h1>Welcome back</h1>
        <p class="sub">Log in to your account.</p>
        <div class="error" id="error"></div>
        <form id="login-form">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" />
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            autocomplete="current-password"
          />
          <button class="btn primary" type="submit" style="width: 100%; margin-top: 20px">
            Log in
          </button>
        </form>
        <p class="small muted" style="margin-top: 16px">
          No account? <a href="/register">Create one</a>.
        </p>
      </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
      const form = document.getElementById("login-form");
      const errorBox = document.getElementById("error");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorBox.style.display = "none";
        try {
          await submitAuth("/api/auth/login", {
            email: form.email.value.trim(),
            password: form.password.value,
          });
        } catch (err) {
          errorBox.textContent = err.message;
          errorBox.style.display = "block";
        }
      });
    </script>
  </body>
</html>
