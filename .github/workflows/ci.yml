name: DevSecOps CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: write

env:
  NODE_VERSION: "24"
  # Set DOCKERHUB_USERNAME + DOCKERHUB_PASSWORD secrets to enable the push stage
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # --------------------------------------------------------------------
  # 1. Secrets scanning
  # --------------------------------------------------------------------
  secrets-scan:
    name: 1. Secrets scanning - Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so secret scanners see all commits

      - name: Secrets scanning - Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------------
  # 2. Static Application Security Testing (SAST)
  # --------------------------------------------------------------------
  sast:
    name: 2. Static analysis - Semgrep
    runs-on: ubuntu-latest
    needs: secrets-scan
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Semgrep
        run: pipx install semgrep

      - name: Static code analysis - Semgrep
        id: semgrep-scan
        continue-on-error: true # findings surface as SARIF in the Security tab
        run: semgrep --config p/owasp-top-ten --sarif --output results.sarif .

      - name: Upload Semgrep SARIF
        if: always() && steps.semgrep-scan.conclusion != 'skipped'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: semgrep

  # --------------------------------------------------------------------
  # 3. Software Composition Analysis (SCA)
  # --------------------------------------------------------------------
  sca:
    name: 3. Software composition analysis - OWASP
    runs-on: ubuntu-latest
    needs: secrets-scan
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Dependency check - OWASP Dependency-Check
        continue-on-error: true # NVD database sync can be flaky; results are uploaded regardless
        uses: dependency-check/Dependency-Check_Action@1.1.0
        with:
          project: "saas-web-application"
          path: "."
          format: "SARIF"
          args: "--failOnCVSS 7 --enableRetired --prettyPrint"

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owasp-dependency-check
          path: reports/
          if-no-files-found: ignore

  # --------------------------------------------------------------------
  # 4. Code quality (lint + format)
  # --------------------------------------------------------------------
  quality:
    name: 4. Lint & format
    runs-on: ubuntu-latest
    needs: secrets-scan
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Code quality & lint - ESLint
        run: npm run lint

      - name: Format check - Prettier
        run: npm run format:check

  # --------------------------------------------------------------------
  # 5. Unit tests + coverage
  # --------------------------------------------------------------------
  test:
    name: 5. Unit tests & coverage
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Code coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

  # --------------------------------------------------------------------
  # 6. Build application + Docker image (shared as an artifact)
  # --------------------------------------------------------------------
  build:
    name: 6. Build application & image
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application - npm
        run: npm run build

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: |
            saas-web-application:${{ steps.meta.outputs.tag }}
            saas-web-application:ci

      - name: Save Docker image artifact
        run: docker save saas-web-application:ci | gzip > image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-image
          path: image.tar.gz
          retention-days: 1

  # --------------------------------------------------------------------
  # 7. Container image scanning (Trivy + Grype) & SBOM (Syft)
  # --------------------------------------------------------------------
  image-scan:
    name: 7. Container image scan & SBOM
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v7
        with:
          name: app-image
          path: image/

      - name: Load Docker image
        run: gunzip -c image/image.tar.gz | docker load

      - name: Container image scan - Trivy
        id: trivy-scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: saas-web-application:ci
          format: sarif
          output: trivy-results.sarif
          exit-code: "0" # monitor-only; findings surface as SARIF in the Security tab
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Upload Trivy SARIF
        if: always() && steps.trivy-scan.conclusion != 'skipped'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Container image scan - Grype
        id: grype-scan
        uses: anchore/scan-action@v7
        with:
          image: saas-web-application:ci
          fail-build: false # monitor-only; findings surface as SARIF in the Security tab
          severity-cutoff: high
          output-format: sarif
          output-file: grype-results.sarif

      - name: Upload Grype SARIF
        if: always() && steps.grype-scan.conclusion != 'skipped'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: grype-results.sarif
          category: grype

      - name: Generate SBOM - Syft
        uses: anchore/sbom-action@v0
        with:
          image: saas-web-application:ci
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cyclonedx.json
          if-no-files-found: ignore

  # --------------------------------------------------------------------
  # 8. Push image to Docker Hub (main branch only, secrets required)
  # --------------------------------------------------------------------
  push-image:
    name: 8. Push image to Docker Hub
    runs-on: ubuntu-latest
    needs: image-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Download image artifact
        uses: actions/download-artifact@v7
        with:
          name: app-image
          path: image/

      - name: Load Docker image
        run: gunzip -c image/image.tar.gz | docker load

      - name: Tag and push image
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker tag saas-web-application:ci "$DOCKERHUB_USERNAME/saas-web-application:latest"
          docker tag saas-web-application:ci "$DOCKERHUB_USERNAME/saas-web-application:${GITHUB_SHA::8}"
          docker push "$DOCKERHUB_USERNAME/saas-web-application:latest"
          docker push "$DOCKERHUB_USERNAME/saas-web-application:${GITHUB_SHA::8}"
