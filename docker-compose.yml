services:
  web:
    build: .
    image: saas-web-application
    container_name: saas-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Override JWT_SECRET (and other vars) by exporting them before
      # `docker compose up`, e.g. JWT_SECRET=... docker compose up -d
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: "3000"
      HOST: 0.0.0.0
    volumes:
      # Persist the SQLite database across container restarts
      - saas-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  saas-data:
